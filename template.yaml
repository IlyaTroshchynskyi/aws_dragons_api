AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  dragons_api

  Sample SAM Template for dragons_api

Globals:
  Function:
    Timeout: 3
    MemorySize: 128
    Tracing: Active
    Environment:

      Variables:
        AWS_SAM_LOCAL: prod
#  All Lambda instances are set to UTC timezone.
#  Incase you want to change that behavior you need to update environment variable.
        TZ: EET

  Api:
    TracingEnabled: true

Resources:

  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: dragonsapi
      AccessControl: Private
      VersioningConfiguration:
        Status: Enabled

  ReportBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: dragonsapireport
      AccessControl: Private
      VersioningConfiguration:
        Status: Enabled

  DragonTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: "dragons"
      AttributeDefinitions:
        - AttributeName: "dragon_id"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "dragon_id"
          KeyType: "HASH"
      ProvisionedThroughput:
        ReadCapacityUnits: "5"
        WriteCapacityUnits: "5"
      StreamSpecification:
        StreamViewType: KEYS_ONLY

  StatisticsDragonTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: "dragon_statistics"
      AttributeDefinitions:
        - AttributeName: "record_id"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "record_id"
          KeyType: "HASH"
      ProvisionedThroughput:
        ReadCapacityUnits: "5"
        WriteCapacityUnits: "5"
      TimeToLiveSpecification:
        AttributeName: dragon_ttl
        Enabled: true

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      UserPoolName: DragonUserPool
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Schema:
        - AttributeDataType: String
          Name: "preferred_username"
          Required: true
          Mutable: true
        - AttributeDataType: String
          Name: "email"
          Required: true
          Mutable: true
      Policies:
        PasswordPolicy:
          MinimumLength: 6
          RequireLowercase: true
          RequireNumbers: false
          RequireSymbols: false
          RequireUppercase: true

  UserPoolTokenClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: DragonsUserPoolClient
      GenerateSecret: false # Boolean to specify whether you want to generate a secret for the user pool client being created.
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs:
        - https://example.com/callback
      LogoutURLs:
        - https://example.com/signout
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - implicit
      AllowedOAuthScopes:
        - email
        - openid
        - phone
        - aws.cognito.signin.user.admin

  DragonUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: dragon-domain
      UserPoolId:  !Ref UserPool

  MyLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      ContentUri: layer
      CompatibleRuntimes:
        - python3.9
    Metadata:
      BuildMethod: makefile

  DragonApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: DragonApi
      StageName: Prod
      # This is only needed if you are Requesting from a domain that is not shared with this API Domain
      # Know the security implications before doing this on a production site
      Cors:
        AllowMethods: "'*'"
        AllowHeaders: "'*'"
        AllowOrigin: "'*'"
      Auth:
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt "UserPool.Arn"

  DragonFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dragons_api/
      Handler: app.lambda_handler
      Runtime: python3.9
      Architectures:
      - x86_64
      Layers:
        - !Ref MyLayer
      Environment:
        Variables:
          DYNAMODB_ENDPOINT: url
          TABLE_NAME: !Ref DragonTable

      Events:
        ListDragons:
          Type: Api
          Properties:
            RestApiId: !Ref DragonApi
            Path: /dragons
            Method: get

        CreateDragon:
          Type: Api
          Properties:
            RestApiId: !Ref DragonApi
            Auth:
              Authorizer: CognitoAuthorizer
            Path: /dragons
            Method: post

        GetDragon:
          Type: Api
          Properties:
            RestApiId: !Ref DragonApi
            Path: /dragons/{dragon_id}
            Method: get

        PatchDragon:
          Type: Api
          Properties:
            RestApiId: !Ref DragonApi
            Auth:
              Authorizer: CognitoAuthorizer
            Path: /dragons/{dragon_id}
            Method: patch

        DeleteDragon:
          Type: Api
          Properties:
            RestApiId: !Ref DragonApi
            Auth:
              Authorizer: CognitoAuthorizer
            Path: /dragons/{dragon_id}
            Method: delete

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DragonTable

  GeneratePresignedUrl:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dragons_api/
      Handler: generate_url.lambda_handler
      Runtime: python3.9
      Layers:
        - !Ref MyLayer
      Environment:
        Variables:
          AWS_S3_ENDPOINT_URL: http://s3:9000
          ACCESS_KEY_ID: access_key
          SECRET_ACCESS_KEY: secret_key
          AWS_S3_BUCKET_NAME: dragonsapi
      Policies:
        - S3WritePolicy:
             BucketName: dragonsapi
      Events:
        GenerateUrl:
          Type: Api
          Properties:
            RestApiId: !Ref DragonApi
            Auth:
              Authorizer: CognitoAuthorizer
            Path: /generate_url
            Method: get

  UploadDragonsToDynamoDb:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dragons_api/
      Handler: upload_to_db.lambda_handler
      Runtime: python3.9
      Layers:
        - !Ref MyLayer
      Environment:
        Variables:
          AWS_S3_ENDPOINT_URL: http://s3:9000
          ACCESS_KEY_ID: access_key
          SECRET_ACCESS_KEY: secret_key
          AWS_S3_BUCKET_NAME: dragonsapi
          DYNAMODB_ENDPOINT: url
          TABLE_NAME: !Ref DragonTable

      Policies:
        - S3ReadPolicy:
            BucketName: dragonsapi
        - DynamoDBWritePolicy:
            TableName: !Ref DragonTable

      Events:
        FileUpload:
          Type: S3
          Properties:
            Bucket:  !Ref Bucket
            Events: s3:ObjectCreated:Put
            Filter:
              S3Key:
                Rules:
                  - Name: suffix
                    Value: ".csv"

# =======================================task EventBridge
  DynamoDbStreamEventCreator:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dragons_api/
      Handler: dynamodb_stream_event.lambda_handler
      Runtime: python3.9
      Layers:
        - !Ref MyLayer
      Environment:
        Variables:
          EVENT_BRIDGE_ENDPOINT: url
          SOURCE: "DynamoDbStreamEventCreator"
          EVENT_BUS_NAME: !Ref DragonEventBus
          SOURCE_DANGER_DRAGON: NotifyAboutDangerousDragon

      Policies:
        - DynamoDBStreamReadPolicy:
            TableName: !Ref DragonTable
            StreamName: !GetAtt DragonTable.StreamArn
        - EventBridgePutEventsPolicy:
            EventBusName: !Ref DragonEventBus

      Events:
        DynamoDbStream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt DragonTable.StreamArn
            StartingPosition: LATEST

  DragonEventBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: "DragonsEventBus"

  DragonEventBusRule:
    Type: AWS::Events::Rule
    Properties:
      EventBusName: !Ref DragonEventBus
      Name: DragonsEventsRule
      EventPattern:
        source:
          - DynamoDbStreamEventCreator
      Targets:
          - Arn: !GetAtt EventBridgeHandler.Arn
            Id: !Ref EventBridgeHandler

# important permission because when you use console background job will create this permission
# you don't see in aws console of event rule this permission
  EventsRulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref EventBridgeHandler
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DragonEventBusRule.Arn


  EventBridgeHandler:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dragons_api/
      Handler: handler_event_bridge.lambda_handler
      Runtime: python3.9
      Layers:
        - !Ref MyLayer
      Environment:
        Variables:
          DYNAMODB_ENDPOINT: url
          STATISTICS_TABLE_NAME: !Ref StatisticsDragonTable
          TIME_TO_LIVE: 24

      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref StatisticsDragonTable
# Task generate report ==========================================================================
  GenerateReport:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dragons_api/
      Handler: generate_report.lambda_handler
      Runtime: python3.9
      Layers:
        - !Ref MyLayer
      Environment:
        Variables:
          DYNAMODB_ENDPOINT: url
          STATISTICS_TABLE_NAME: !Ref StatisticsDragonTable
          REPORT_BUCKET_NAME: !Ref ReportBucket
          AWS_S3_ENDPOINT_URL: url
          ACCESS_KEY_ID: access_key
          SECRET_ACCESS_KEY: secret_key

      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref StatisticsDragonTable
        - S3WritePolicy:
            BucketName: !Ref ReportBucket

  DragonScheduleEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: DragonsDailyStatistics
      ScheduleExpression:  "cron(0 0 * * ? *)"
      Targets:
        - Arn: !GetAtt GenerateReport.Arn
          Id: !Ref GenerateReport

  DragonScheduleEventsRulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GenerateReport
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com


Outputs:
  DragonFunction:
    Description: "Dragon Lambda Function ARN"
    Value: !GetAtt DragonFunction.Arn
  DragonFunctionIamRole:
    Description: "Implicit IAM Role created for Dragon function"
    Value: !GetAtt DragonFunctionRole.Arn

  EventBusRef:
    Description: "Check Event bus"
    Value: !Ref DragonEventBus
