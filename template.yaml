AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  dragons_api

  Sample SAM Template for dragons_api

Globals:
  Function:
    Timeout: 3
    MemorySize: 128
    Tracing: Active
  Api:
    TracingEnabled: true

Resources:
  DragonTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: "dragons"
      AttributeDefinitions:
        - AttributeName: "dragon_id"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "dragon_id"
          KeyType: "HASH"
      ProvisionedThroughput:
        ReadCapacityUnits: "5"
        WriteCapacityUnits: "5"

  DragonFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dragons_api/
      Handler: app.lambda_handler
      Runtime: python3.9
      Architectures:
      - x86_64
      Environment:
        Variables:
          DYNAMODB_ENDPOINT: url
          TABLE_NAME: dragons
          AWS_SAM_LOCAL: 0

      Events:
        ListDragons:
          Type: Api
          Properties:
            Path: /dragons
            Method: get

        CreateDragon:
          Type: Api
          Properties:
            Path: /dragons
            Method: post

      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DragonTable

Outputs:
  DragonFunction:
    Description: "Dragon Lambda Function ARN"
    Value: !GetAtt DragonFunction.Arn
  DragonFunctionIamRole:
    Description: "Implicit IAM Role created for Dragon function"
    Value: !GetAtt DragonFunctionRole.Arn
